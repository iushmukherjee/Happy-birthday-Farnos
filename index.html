<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Birthday Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- MapLibre GL JS Library & Stylesheet -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map { 
      position: absolute; 
      top: 0; 
      bottom: 0; 
      width: 100%; 
      background-color: #f4f4f6; 
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. Initialize the map canvas centered near India/Asia
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {},
      layers: []
    },
    center: [50, 25],
    zoom: 2.5
  });

  map.on('load', () => {
    // -------------------------------------------------------------
    // 2. LOAD WORLD COUNTRY OUTLINES
    // -------------------------------------------------------------
    map.addSource('world-countries', {
      type: 'geojson',
      data: './countries.geojson'
    });

    // Country Fill Color
    map.addLayer({
      id: 'country-fills',
      type: 'fill',
      source: 'world-countries',
      paint: { 
        'fill-color': '#ffffff', 
        'fill-opacity': 0.8 
      }
    });

    // Country Border Lines
    map.addLayer({
      id: 'country-borders',
      type: 'line',
      source: 'world-countries',
      paint: { 
        'line-color': '#d0d0d0', 
        'line-width': 1 
      }
    });

    // Country Names
    map.addLayer({
      id: 'country-labels',
      type: 'symbol',
      source: 'world-countries',
      layout: {
        'text-field': ['get', 'ADMIN'],
        'text-size': 11,
        'text-font': ['Open Sans Regular', 'Arial Unicode MS Regular']
      },
      paint: { 
        'text-color': '#999999' 
      }
    });

    // -------------------------------------------------------------
    // 3. LOAD YOUR BIRTHDAY MARKERS
    // -------------------------------------------------------------
    map.addSource('birthday-pins', {
      type: 'geojson',
      data: './markers.geojson'
    });

    // Red Pin Dots
    map.addLayer({
      id: 'pins-layer',
      type: 'circle',
      source: 'birthday-pins',
      paint: {
        'circle-radius': 8,
        'circle-color': '#ff3366',
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff'
      }
    });

    // Location Text Labels next to Pins
    map.addLayer({
      id: 'pins-labels',
      type: 'symbol',
      source: 'birthday-pins',
      layout: {
        'text-field': ['get', 'title'],
        'text-variable-anchor': ['top', 'bottom', 'left', 'right'],
        'text-radial-offset': 1,
        'text-size': 12
      },
      paint: {
        'text-color': '#111111',
        'text-halo-color': '#ffffff',
        'text-halo-width': 2
      }
    });

    // -------------------------------------------------------------
    // 4. INTERACTION (TAP PIN -> SHOW POPUP -> OPEN PAGE)
    // -------------------------------------------------------------
    map.on('click', 'pins-layer', (e) => {
      const coordinates = e.features[0].geometry.coordinates.slice();
      const { title, subtitle, url } = e.features[0].properties;

      new maplibregl.Popup()
        .setLngLat(coordinates)
        .setHTML(`
          <div style="text-align: center; padding: 6px;">
            <strong style="font-size: 15px; color: #111;">${title}</strong><br/>
            <span style="font-size: 12px; color: #666;">${subtitle || ''}</span><br/><br/>
            <a href="${url}" style="background-color: #ff3366; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 12px; display: inline-block;">
              Open Page &rarr;
            </a>
          </div>
        `)
        .addTo(map);
    });

    // Change cursor style on pin hover
    map.on('mouseenter', 'pins-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'pins-layer', () => { map.getCanvas().style.cursor = ''; });
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Birthday Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- MapLibre GL JS Library & CSS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map { 
      position: absolute; 
      top: 0; 
      bottom: 0; 
      width: 100%; 
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 1. Initialize Map with clean OpenStreetMap background (No grey boxes!)
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'osm-tiles': {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap contributors'
        }
      },
      layers: [
        {
          id: 'osm-layer',
          type: 'raster',
          source: 'osm-tiles'
        }
      ]
    },
    center: [50, 25],
    zoom: 2.5
  });

  map.on('load', () => {
    // 2. Load Your Birthday Markers
    map.addSource('birthday-pins', {
      type: 'geojson',
      data: './markers.geojson'
    });

    // Red Pin Dots
    map.addLayer({
      id: 'pins-layer',
      type: 'circle',
      source: 'birthday-pins',
      paint: {
        'circle-radius': 8,
        'circle-color': '#ff3366',
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff'
      }
    });

    // Text Labels Next to Pins
    map.addLayer({
      id: 'pins-labels',
      type: 'symbol',
      source: 'birthday-pins',
      layout: {
        'text-field': ['get', 'title'],
        'text-variable-anchor': ['top', 'bottom', 'left', 'right'],
        'text-radial-offset': 1,
        'text-size': 12
      },
      paint: {
        'text-color': '#111111',
        'text-halo-color': '#ffffff',
        'text-halo-width': 2
      }
    });

    // 3. Click Handler (Tap Pin -> Open Popup with Link)
    map.on('click', 'pins-layer', (e) => {
      const coordinates = e.features[0].geometry.coordinates.slice();
      const { title, subtitle, url } = e.features[0].properties;

      new maplibregl.Popup()
        .setLngLat(coordinates)
        .setHTML(`
          <div style="text-align: center; padding: 6px;">
            <strong style="font-size: 15px; color: #111;">${title}</strong><br/>
            <span style="font-size: 12px; color: #666;">${subtitle || ''}</span><br/><br/>
            <a href="${url}" style="background-color: #ff3366; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-size: 12px; display: inline-block;">
              Open Page &rarr;
            </a>
          </div>
        `)
        .addTo(map);
    });

    // Pointer Cursor Effects
    map.on('mouseenter', 'pins-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'pins-layer', () => { map.getCanvas().style.cursor = ''; });
  });
</script>

</body>
</html>

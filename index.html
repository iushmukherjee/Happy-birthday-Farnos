<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangalore 🌆</title>
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fff5f7;
      color: #333;
      text-align: center;
    }

    .card {
      max-width: 450px;
      margin: 30px auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    h1 {
      color: #ff3366;
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
    }

    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #ff3366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bangalore 🌆</h1>
    <p>Happy Birthday! 🎂✨</p>
    <p>Write your special birthday note or memory here!</p>

    <a href="./index.html" class="back-btn">&larr; Back to Map</a>
  </div>

</html>

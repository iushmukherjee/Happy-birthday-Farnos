
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adamas University 🎓</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fff0f3;
      color: #333;
      text-align: center;
    }
    .frame-card {
      max-width: 480px;
      margin: 20px auto;
      background: #ffffff;
      border: 4px solid #ff3366;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 51, 102, 0.2);
      overflow: hidden;
    }
    .frame-header {
      background: linear-gradient(135deg, #ff3366, #ff6b8b);
      color: #ffffff;
      padding: 20px 15px;
    }
    .frame-header h2 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }
    .frame-header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
      font-weight: 500;
    }
    .frame-body {
      padding: 25px 20px;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #ff3366;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
    }
  </style>
</head>
<body>

  <div class="frame-card">
    <div class="frame-header">
      <h2>🎉 Happy Birthday Farnos! 🎉</h2>
      <p>Let's take you to Adamas University 🎓</p>
    </div>
    <div class="frame-body">
      <p>Write your special memory or birthday note here!</p>
      <a href="./index.html" class="back-btn">&larr; Back to Map</a>
    </div>
  </div>

</body>
</html>
